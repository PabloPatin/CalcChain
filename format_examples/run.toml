# run.toml описывает только пользовательское намерение запуска уже собранного
# рабочего окружения. Он не описывает сборку или публикацию.

# Необязательное поле.
# Default: последняя версия схемы run.toml, поддерживаемая текущей версией приложения.
schema_version = "1.0"

# Необязательное поле.
# Default: [].
# Значения секретов здесь не хранятся. Пользовательский файл только перечисляет
# имена секретных переменных, которые должны быть предоставлены при запуске.
# В manifest и logs попадет только факт предоставления, не значение.
secret_env = ["LICENSE_TOKEN"]

[run]

# Обязательное поле.
executable = "bin/heat_solver.exe"

# Необязательное поле.
# Default: [].
args = ["--case", "input"]

# Необязательное поле.
# Default: "." - корень рабочего окружения расчета.
cwd = "."

# Необязательное поле.
# Default: null, то есть без ограничения времени.
timeout_seconds = 3600

# Необязательное поле.
# Default: "utf-8".
# Используется для перекодирования stdin/stdout/stderr внешнего процесса
# во внутренние UTF-8 логи CalcChain.
encoding = "utf-8"

# Необязательное поле.
# Default: "none".
# Допустимые значения: "none", "script", "manual".
# "manual" означает ручной диалоговый режим без prompt-response автоматизации.
stdin_mode = "script"

# Необязательное поле.
# Используется только при stdin_mode = "script".
# Default: "".
stdin_text = "start\nconfirm\n"

# Необязательный блок.
# Default: пустой набор дополнительных переменных среды.
# Значения можно писать в manifest и runtime logs.
[env]
OMP_NUM_THREADS = "4"
CALCCHAIN_MODE = "run"
