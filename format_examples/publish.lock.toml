publish_toml_sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[publish]
message = "Publish heat-case-42 results"

[service_target]
type = "svn"
location = "https://svn.example.org/calc-results"
