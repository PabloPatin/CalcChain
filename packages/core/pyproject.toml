[project]
name = "calcchain-core"
version = "0.1.0"
description = "Core calculation lifecycle and plugin contracts for CalcChain"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.0",
  "packaging>=24.0",
  "tomlkit>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcchain_core"]
