[project]
name = "calcchain-plugin-system"
version = "0.1.0"
description = "Plugin discovery, dependency environments, and activation flow for CalcChain"
requires-python = ">=3.11"
dependencies = [
  "calcchain-capabilities==0.1.0",
  "packaging>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcchain_plugin_system"]
