[project]
name = "calcchain-backend"
version = "0.1.0"
description = "Backend API for CalcChain"
requires-python = ">=3.11"
dependencies = [
    "calcchain-core>=0.1.0",
    "calcchain-plugin-system>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.0",
]

[tool.uv.sources]
calcchain-core = { path = "../../packages/core", editable = true }
calcchain-plugin-system = { path = "../../packages/plugin_system", editable = true }

[project.scripts]
calcchain-backend = "calcchain_backend.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
